<div class="container mt-5">
    <h2 class="text-center">JEE Mains Registration Form</h2>
    <form>
        <!-- Personal Details Section -->
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input 
            name="fullName" 
            (change)="onInputChange($event)" 
             type="text" class="form-control" id="fullName" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input  name="dob" 
            (change)="onInputChange($event)"  type="date" class="form-control" id="dob" required>
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input
            name="email" 
            (change)="onInputChange($event)" 
             type="email"
              class="form-control" id="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input
            name="mobile" 
            (change)="onInputChange($event)" 
             type="tel" class="form-control" id="mobile" placeholder="Enter your mobile number" required>
        </div>

        <!-- Academic Details Section -->
        <div class="form-group">
            <label for="board">10+2 Board</label>
            <select
            name="board" 
            (change)="onInputChange($event)" 
            class="form-control" id="board" required>
                <option>Select your board</option>
                <option>CBSE</option>
                <option>ICSE</option>
                <option>State Board</option>
            </select>
        </div>
           <!-- Gender Selection -->
           <div class="form-group">
            <label>Gender</label><br>
            <div class="form-check form-check-inline">
                <input  (change)="onInputChange($event)"  class="form-check-input" type="radio" name="gender" id="male" value="male" required>
                <label class="form-check-label" for="male">Male</label>
            </div>
            <div class="form-check form-check-inline">
                <input  (change)="onInputChange($event)"  class="form-check-input" type="radio" name="gender" id="female" value="female" required>
                <label class="form-check-label" for="female">Female</label>
            </div>
            <div class="form-check form-check-inline">
                <input  (change)="onInputChange($event)"  class="form-check-input" type="radio" name="gender" id="other" value="other" required>
                <label class="form-check-label" for="other">Other</label>
            </div>
        </div>

        <!-- Loop through the list of countries and generate checkboxes -->
        <div class="form-check" *ngFor="let country of countries">
            <input
                class="form-check-input"
                type="checkbox"
                [checked]="selectedCountries.includes(country)"
                (change)="onCheckboxChange($event, country)"> <!-- Handle change event -->
            <label class="form-check-label">{{ country }}</label>
        </div>
        <!-- Loop through the list of countries and generate checkboxes -->
        <div class="form-check" *ngFor="let country of countries">
            <input
                class="form-check-input"
                type="checkbox"
                [checked]="selectedCountries.includes(country)"
                (change)="onCheckboxChange($event, country)"> <!-- Handle change event -->
            <label class="form-check-label">{{ country }}</label>
        </div>

        <div class="form-group">
            <label for="imageInput">Choose an image:</label>
            <input
                type="file"
                id="imageInput"
                accept="image/*"
                (change)="onInputChange($event)"
                required
                class="form-control-file"
                name="image"  
            />
        </div>

               <!-- Image preview -->
               <div *ngIf="formObj.imagePreview">
                <h5>Image Preview:</h5>
                <img [src]="formObj.imagePreview" alt="Selected Image" class="img-thumbnail" style="max-width: 300px;" />
            </div>
    

        <!-- Submit Section -->
        <button type="submit" (click)="onSubmit()" class="btn btn-primary btn-block">Submit</button>
    </form>
</div>
